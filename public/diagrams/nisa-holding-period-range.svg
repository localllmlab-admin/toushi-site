<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6980"/></marker></defs>
<rect width="640" height="346" fill="#ffffff"/>
<text x="320" y="28" font-size="15" fill="#26313f" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">100万円を積立・分散で運用：5年と20年で結果の幅はこう違った</text>
<rect x="130.0" y="56" width="137.1428571428571" height="186" fill="#fbeae7"/>
<text x="198.57142857142856" y="74" font-size="12" fill="#c73e2e" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">元本割れ</text>
