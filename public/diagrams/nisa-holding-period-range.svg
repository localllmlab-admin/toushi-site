<text x="130.0" y="260" font-size="11" fill="#5b6980" text-anchor="middle" font-weight="400" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">0万</text>
<line x1="198.57142857142856" y1="56" x2="198.57142857142856" y2="242" stroke="#dde3ec"/>
