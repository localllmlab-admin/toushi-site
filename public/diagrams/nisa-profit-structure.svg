<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 462" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6980"/></marker></defs>
<rect width="640" height="462" fill="#ffffff"/>
<text x="320" y="28" font-size="16" fill="#26313f" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">利益は「中身」が生み、NISAは税金を「引かない」</text>
<rect x="20" y="50" width="190" height="70" rx="8" fill="#e6f0f8" stroke="#004f86" stroke-width="1.4"/>
<text x="115" y="80" font-size="15" fill="#004f86" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">企業の稼ぎ</text>
<text x="115" y="104" font-size="12" fill="#26313f" text-anchor="middle" font-weight="400" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">配当・株価の上昇</text>
<line x1="115" y1="122" x2="180" y2="158" stroke="#5b6980" stroke-width="2" marker-end="url(#ah)"/>
<rect x="225" y="50" width="190" height="70" rx="8" fill="#e6f0f8" stroke="#004f86" stroke-width="1.4"/>
<text x="320" y="80" font-size="15" fill="#004f86" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">お金を貸した対価</text>
<text x="320" y="104" font-size="12" fill="#26313f" text-anchor="middle" font-weight="400" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">債券の利息</text>
<line x1="320" y1="122" x2="320" y2="158" stroke="#5b6980" stroke-width="2" marker-end="url(#ah)"/>
<rect x="430" y="50" width="190" height="70" rx="8" fill="#e6f0f8" stroke="#004f86" stroke-width="1.4"/>
<text x="525" y="80" font-size="15" fill="#004f86" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">値動きリスクの対価</text>
<text x="525" y="104" font-size="12" fill="#26313f" text-anchor="middle" font-weight="400" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">預金より高い見返りの期待</text>
<line x1="525" y1="122" x2="460" y2="158" stroke="#5b6980" stroke-width="2" marker-end="url(#ah)"/>
<rect x="150" y="162" width="340" height="62" rx="8" fill="#ffffff" stroke="#26313f" stroke-width="1.4"/>
<text x="320" y="189" font-size="15" fill="#26313f" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">箱の中身：株式・投資信託・債券</text>
<text x="320" y="211" font-size="12" fill="#5b6980" text-anchor="middle" font-weight="400" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">利益（値上がり益・配当・分配金）が生まれる</text>
<line x1="250" y1="226" x2="165" y2="268" stroke="#5b6980" stroke-width="2" marker-end="url(#ah)"/>
<line x1="390" y1="226" x2="475" y2="268" stroke="#5b6980" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="270" width="290" height="150" rx="8" fill="#ffffff" stroke="#dde3ec" stroke-width="1.4"/>
<text x="165" y="296" font-size="15" fill="#26313f" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">ふつうの課税口座</text>
<rect x="50" y="314" width="186" height="34" fill="#c3ccd8"/>
<text x="143" y="336" font-size="13" fill="#26313f" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">手元に約80万円</text>
<rect x="236" y="314" width="46" height="34" fill="#fbeae7" stroke="#c73e2e" stroke-width="1"/>
<text x="259" y="336" font-size="13" fill="#c73e2e" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">税</text>
<text x="165" y="372" font-size="12" fill="#5b6980" text-anchor="middle" font-weight="400" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">利益100万円から約20%が</text>
<text x="165" y="392" font-size="12" fill="#5b6980" text-anchor="middle" font-weight="400" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">税金として引かれる</text>
<rect x="330" y="270" width="290" height="150" rx="8" fill="#e5f2ec" stroke="#1f6e50" stroke-width="1.4"/>
<text x="475" y="296" font-size="15" fill="#1f6e50" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">NISA口座（非課税の箱）</text>
<rect x="360" y="314" width="232" height="34" fill="#1f6e50"/>
<text x="476" y="336" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">手元に100万円</text>
<text x="475" y="372" font-size="12" fill="#26313f" text-anchor="middle" font-weight="400" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">利益100万円がそのまま残る</text>
<text x="475" y="392" font-size="12" fill="#5b6980" text-anchor="middle" font-weight="400" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">（値下がりリスクは同じ）</text>
<text x="320" y="446" font-size="13" fill="#004f86" text-anchor="middle" font-weight="700" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif">NISAは利益を「生む」装置ではなく、生まれた利益を「削らない」装置</text>
</svg>
